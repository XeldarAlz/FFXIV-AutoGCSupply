name: Bug report
description: Something's broken or behaving unexpectedly.
title: "[Bug] "
labels: ["bug"]
assignees: ["XeldarAlz"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out as much as you can; it makes a huge difference.

        If you're not sure whether it's a bug or expected behavior, prefer the [Q&A discussions](https://github.com/XeldarAlz/FFXIV-AutoGCSupply/discussions/new?category=q-a); triage is faster there.

        For security issues, please use [private vulnerability reporting](https://github.com/XeldarAlz/FFXIV-AutoGCSupply/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? What did you expect to see instead?
      placeholder: "The plugin reached the Personnel Officer but never opened the supply and provisioning window..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug. If it's intermittent, say so.
      placeholder: |
        1. Open `/gcsupply`
        2. Choose requests on the Today page
        3. Press Automate
        4. ...
    validations:
      required: true

  - type: dropdown
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown in `/xlplugins` next to "Auto GC Supply".
      options:
        - 1.0.0.3
        - 1.0.0.2
        - 1.0.0.1
        - 1.0.0.0
        - Older / not sure
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Region
      description: Game data, client languages and market board prices differ per region, so the region is a frequent root cause.
      options:
        - North America
        - Europe
        - Japan
        - Oceania
        - Not sure
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Grand Company and world of the run
      description: Which Grand Company is your character in, and on which world did the run fail?
      placeholder: "Immortal Flames, on Gilgamesh (Aether)"

  - type: input
    id: shopper-version
    attributes:
      label: Auto Shopper version
      description: Shown in `/xlplugins` next to "Auto Shopper". Buying needs 1.1.0.0 or later. Write "not installed" when you run hand-in only.
      placeholder: "1.1.0.0"
    validations:
      required: true

  - type: dropdown
    id: dry-run
    attributes:
      label: Was Auto Shopper's dry run on?
      description: The Dry run tile next to Automate shows Auto Shopper's switch. While it is on, a run buys nothing and hands nothing in. Without Auto Shopper there is no dry run, and a hand-in-only run delivers for real.
      options:
        - Yes, it was a dry run (nothing bought or handed in)
        - No, it bought or handed in for real
        - Auto Shopper is not installed or is too old (hand-in only, for real)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where in the run did it fail?
      description: The run view on the Today page and the Console show the stage a run is in. A run goes reading the requests -> pricing -> buying through Auto Shopper -> travelling to your Grand Company -> handing in at the Personnel Officer -> confirming each delivery.
      options:
        - Before Automate (the Today page, the request list, owned counts, estimates, the spend cap, settings, Automate refusing to start)
        - Reading the requests (the Timers window, missing or wrong requests, the daily reset)
        - Pricing (prices that never came, failed, or look wrong)
        - Buying through Auto Shopper (refused, the permission card, wrong items or amounts, stopping or pausing while it buys)
        - Travelling to your Grand Company (teleport, aethernet, walking to the Personnel Officer)
        - Handing in (the officer's menu, the supply list, a wrong row or quality, a prompt, the reward window)
        - Confirming a delivery (bags, seals or the supply list looked wrong, a delivery marked unconfirmed)
        - Pausing, resuming or stopping a run outside the buying
        - History or the Console
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: |
        **If you can provide any of these, it turns guesswork into a fix.**

        - **Plugin console**: open `/gcsupply log`, press *Copy log* and paste the result into the console field below. It already includes the plugin version, Dalamud version and zone.
        - **Dalamud log**: open `/xllog`, click the *Open log folder* button at the bottom-right, attach `dalamud.log`. Filter by `[AGCS]` if you want to trim it down; when the buying went wrong, keep the `[ASHOP]` lines of Auto Shopper too.
        - **The supply list and the reward window** as screenshots, if the plugin read a request wrong, picked the wrong row, or stopped on the reward window.
        - **Screenshots / short clip** if the issue is visual (selection state, wrong tooltip, frozen card, etc.)
        - **Other plugins active** that touch dialogs, movement, teleport, or input, which helps rule out conflicts.

  - type: textarea
    id: logs
    attributes:
      label: Console output (optional)
      description: |
        Paste what *Copy log* on the plugin's Console page (`/gcsupply log`) put on your clipboard. Short snippets (chat-log tail, Dalamud error text) also belong here; attach full `dalamud.log` files under **Attachments** above.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Your client language, the Supply quality and seal cap settings under Settings, Run, the run spend cap, which classes you turn in for, hunches, anything that helps the bug land.

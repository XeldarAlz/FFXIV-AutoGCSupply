name: Bug report
description: Something's broken or behaving unexpectedly.
title: "[Bug] "
labels: ["bug"]
assignees: ["XeldarAlz"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out as much as you can; it makes a huge difference.

        If you're not sure whether it's a bug or expected behavior, prefer the [Q&A discussions](https://github.com/XeldarAlz/FFXIV-AutoGCSupply/discussions/new?category=q-a); triage is faster there.

        For security issues, please use [private vulnerability reporting](https://github.com/XeldarAlz/FFXIV-AutoGCSupply/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? What did you expect to see instead?
      placeholder: "The plugin reached the Personnel Officer but never opened the supply and provisioning window..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug. If it's intermittent, say so.
      placeholder: |
        1. Open `/gcsupply`
        2. Choose requests on the Today page
        3. Press Automate
        4. ...
    validations:
      required: true

  - type: dropdown
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown in `/xlplugins` next to "Auto GC Supply".
      options:
        - 1.0.0.0
        - Older / not sure
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Region
      description: Game data and market board prices differ per region, so the region is a frequent root cause.
      options:
        - North America
        - Europe
        - Japan
        - Oceania
        - Not sure
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Grand Company and world of the run
      description: Which Grand Company is your character in, and on which world did the run fail?
      placeholder: "Immortal Flames, on Gilgamesh (Aether)"

  - type: dropdown
    id: buying
    attributes:
      label: Did the run buy anything?
      description: Auto GC Supply buys missing items through Auto Shopper, with Auto Shopper's own dry run, caps and confirmations. A hand-in-only run buys nothing.
      options:
        - Yes, Auto Shopper bought items for this run
        - Auto Shopper ran, but on dry run
        - No, it was a hand-in-only run
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where in the run did it fail?
      description: The Today page and the Console show the stage a run is in. A run goes reading the requests -> buying through Auto Shopper -> travelling to your Grand Company -> walking to the Personnel Officer -> handing in -> confirming the delivery.
      options:
        - Before Automate (the Today page, the request list, owned counts, estimates, settings)
        - Reading the day's supply and provisioning requests
        - Buying the missing items through Auto Shopper
        - Travelling to your Grand Company (teleport, aethernet, walking)
        - Walking to or talking to the Personnel Officer
        - Handing in an item (wrong item, wrong quality, a prompt it should not answer)
        - Confirming a delivery (seals, XP or the remaining requests looked wrong)
        - Pausing, resuming or stopping a run
        - History or the Console
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: |
        **If you can provide any of these, it turns guesswork into a fix.**

        - **Plugin console**: open `/gcsupply log`, press *Copy log* and paste the result into the console field below. It already includes the plugin version, Dalamud version and zone.
        - **Dalamud log**: open `/xllog`, click the *Open log folder* button at the bottom-right, attach `dalamud.log`. Filter by `[AGCS]` if you want to trim it down.
        - **The supply and provisioning window** as a screenshot, if the plugin read a request wrong or handed in the wrong item.
        - **Screenshots / short clip** if the issue is visual (selection state, wrong tooltip, frozen card, etc.)
        - **Other plugins active** that touch dialogs, movement, teleport, or input, which helps rule out conflicts.

  - type: textarea
    id: logs
    attributes:
      label: Console output (optional)
      description: |
        Paste what *Copy log* on the plugin's Console page (`/gcsupply log`) put on your clipboard. Short snippets (chat-log tail, Dalamud error text) also belong here; attach full `dalamud.log` files under **Attachments** above.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Whether Auto Shopper is installed and on dry run, which classes you turn in for, hunches, anything that helps the bug land.
